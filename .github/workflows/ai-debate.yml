name: AI Debate

on:
  issues:
    types: [labeled]

jobs:
  debate:
    if: github.event.label.name == 'debate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@v5

      - name: Gemini opening
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are Gemini in a debate with ChatGPT.
            Topic: ${{ github.event.issue.title }}
            Details: ${{ github.event.issue.body }}
            Give your opening argument. Be factual, concise, and directly address the topic.

      - name: Save Gemini argument
        env:
          GEMINI_RESPONSE: ${{ steps.gemini.outputs.summary }}
        run: |
          mkdir -p debates
          printf '%s\n' "${GEMINI_RESPONSE}" > debates/gemini-1.md

      - name: ChatGPT response
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          output-file: debates/chatgpt-1.md
          prompt: |
            You are ChatGPT in a debate with Gemini.
            Topic: ${{ github.event.issue.title }}
            Details: ${{ github.event.issue.body }}
            Gemini's opening argument is in debates/gemini-1.md.
            Read that file, then directly rebut its strongest points.
            Be factual, concise, and do not invent evidence.

      - name: Gemini rebuttal
        id: gemini2
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are Gemini in a debate with ChatGPT.
            Topic: ${{ github.event.issue.title }}
            Details: ${{ github.event.issue.body }}
            ChatGPT's response is in debates/chatgpt-1.md.
            Read that file and give a direct rebuttal.
            Be factual, concise, and address the strongest counterargument.

      - name: Save Gemini rebuttal
        env:
          GEMINI_RESPONSE: ${{ steps.gemini2.outputs.summary }}
        run: |
          printf '%s\n' "${GEMINI_RESPONSE}" > debates/gemini-2.md

      - name: Save transcript
        run: |
          {
            echo "# AI Debate"
            echo
            echo "## Topic"
            echo "${{ github.event.issue.title }}"
            echo
            echo "## Gemini — Round 1"
            cat debates/gemini-1.md
            echo
            echo "## ChatGPT — Round 1"
            cat debates/chatgpt-1.md
            echo
            echo "## Gemini — Round 2"
            cat debates/gemini-2.md
          } > debates/current.md

      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debates/
          git commit -m "chore: record AI debate #${{ github.event.issue.number }}" || exit 0
          git push
